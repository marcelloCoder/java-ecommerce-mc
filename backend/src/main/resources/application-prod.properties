# Perfil de produção — Postgres gerenciado. Sobrescreva via env no deploy.
# Ex.: DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, CORS_ORIGINS, PASSWORD_RECOVER_URI, CLIENT_ID, CLIENT_SECRET

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mshop}
spring.datasource.username=${DATABASE_USERNAME:mshop}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Schema only — no demo seed in production
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Domínio real do SPA mShop (sem localhost). Em produção defina CORS_ORIGINS via env.
cors.origins=${CORS_ORIGINS:https://www.mshop.example.com}

# Access token curto (15 min) + refresh (7 dias) — ver security.jwt.* em application.properties
security.jwt.duration=${JWT_DURATION:900}
security.jwt.refresh-duration=${JWT_REFRESH_DURATION:604800}

# Link do e-mail de recuperação deve apontar para o front em produção
email.password-recover.uri=${PASSWORD_RECOVER_URI:https://www.mshop.example.com/recover-password/}

# Loopback BFF → Authorization Server (mesmo processo). Em container/proxy, ajuste se necessário.
security.token-uri=${SECURITY_TOKEN_URI:http://127.0.0.1:8080/oauth2/token}
