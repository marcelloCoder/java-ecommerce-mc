#spring.application.name=ecommerce

spring.profiles.active=${APP_PROFILE:test}

spring.jpa.open-in-view=false

# Flyway: enabled on Postgres profiles (dev/prod). Disabled on test (H2 + import.sql).
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

security.client-id=${CLIENT_ID:client-id-change-me}
security.client-secret=${CLIENT_SECRET:client-secret-change-me}
# BFF login exchanges credentials server-side; never expose client-secret to the SPA.
security.token-uri=${SECURITY_TOKEN_URI:http://127.0.0.1:8080/oauth2/token}

# Access token TTL (seconds). Prod profile overrides to 900 (15 min).
security.jwt.duration=${JWT_DURATION:86400}
# Refresh token TTL (seconds). Default 7 days.
security.jwt.refresh-duration=${JWT_REFRESH_DURATION:604800}

cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:noreply@mshop.local}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${EMAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${EMAIL_SMTP_STARTTLS:true}

email.password-recover.token.minutes=${PASSWORD_RECOVER_TOKEN_MINUTES:30}
email.password-recover.uri=${PASSWORD_RECOVER_URI:http://localhost:5173/recover-password/}
